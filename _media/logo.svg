<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient for AI/Web Dev vibes -->
    <linearGradient id="ai-music-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring (AI / Web Ecosystem) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ai-music-grad)" stroke-width="12" opacity="0.3" stroke-dasharray="16 12" />

  <!-- Main Soundwave / Neural Nodes Group -->
  <g filter="url(#glow)">
    <!-- Circuit / Code Bracket Accents (Web Dev) -->
    <path d="M 140 190 L 90 256 L 140 322" fill="none" stroke="url(#ai-music-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 372 190 L 422 256 L 372 322" fill="none" stroke="url(#ai-music-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Music Equalizer / Neural Connections (AI + Music) -->
    <!-- Bar 1 -->
    <line x1="180" y1="220" x2="180" y2="292" stroke="url(#ai-music-grad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="180" cy="200" r="10" fill="#06B6D4" />

    <!-- Bar 2 (Peak) -->
    <line x1="230" y1="160" x2="230" y2="352" stroke="url(#ai-music-grad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="230" cy="372" r="10" fill="#6366F1" />

    <!-- Bar 3 (Center High) -->
    <line x1="282" y1="130" x2="282" y2="382" stroke="url(#ai-music-grad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="282" cy="110" r="10" fill="#8B5CF6" />

    <!-- Bar 4 -->
    <line x1="332" y1="200" x2="332" y2="312" stroke="url(#ai-music-grad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="332" cy="332" r="10" fill="#06B6D4" />
  </g>

  <!-- Central Intersecting Data Rays (AI Logic) -->
  <path d="M 180 256 H 332" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-dasharray="8 6" />
</svg>
